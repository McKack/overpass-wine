name: Build OverPass Wine

# Started by hand only: a full build takes about as long as GitHub's 3-hour limit, so releases are built on a Mac
# (overpass/build.sh) and uploaded with gh release create.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Wine on macOS is x86_64 (run under Rosetta 2 on Apple silicon), so build on Intel.
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install bison cmake flex mingw-w64 pkgconf dylibbundler ccache meson ninja nasm

      # Compiler cache: each run saves a new one and restores the most recent, so only changed files compile.
      # A new compiler version (brew upgrades mingw or Xcode) simply misses and rebuilds.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      # The libraries Wine uses and GStreamer, rebuilt only when the script that builds them changes (build.sh
      # checks too).
      - uses: actions/cache@v4
        with:
          path: build-deps
          key: deps-${{ runner.os }}-${{ hashFiles('overpass/build-deps.sh') }}
      - uses: actions/cache@v4
        with:
          path: build-gstreamer
          key: gstreamer-${{ runner.os }}-${{ hashFiles('overpass/build-gstreamer.sh') }}

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir="$HOME/Library/Caches/ccache"
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true

      - name: Build and package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/overpass-wine-* ]]; then
            export OVERPASS_WINE_VERSION="${GITHUB_REF_NAME#overpass-wine-}"
          else
            export OVERPASS_WINE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          overpass/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: overpass-wine
          path: overpass-wine-*.tar.xz

  # Separate from the build so a failing or hanging test still leaves the build downloadable, and so the
  # tests can be re-run on it (here with "Re-run failed jobs", or with the Smoke test workflow).
  test:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overpass-wine
      - name: Smoke test
        run: |
          tar -xJf overpass-wine-*.tar.xz -C "$RUNNER_TEMP"
          overpass/smoke-test.sh "$(ls -d "$RUNNER_TEMP"/overpass-wine-*/)"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/overpass-wine-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overpass-wine
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" overpass-wine-*.tar.xz \
            --title "$GITHUB_REF_NAME" --notes-file overpass/README.md
